<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#183247"><title>Everhaven | Reset Password</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--navy:#183247;--deep:#102635;--copper:#b97852;--cream:#f6f3ed;--paper:#fffdf9;--ink:#243642;--muted:#687780;--line:#dedbd3}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:14px 'DM Sans',sans-serif}.top{background:var(--deep);color:white;padding:22px 6%;font:600 26px 'Cormorant Garamond',serif;letter-spacing:1px}.top small{display:block;font:9px 'DM Sans',sans-serif;letter-spacing:3px;color:#e0b99f}.panel{background:var(--paper);border:1px solid var(--line);max-width:460px;margin:55px auto;padding:28px 24px}h1{font:500 42px 'Cormorant Garamond',serif;color:var(--navy);margin:0 0 8px}.muted{color:var(--muted)}.field{display:block;width:100%;padding:13px;margin:7px 0 16px;border:1px solid var(--line);background:#fff;font:14px 'DM Sans',sans-serif}button{border:0;background:var(--copper);color:white;padding:13px 19px;font-weight:700;cursor:pointer;width:100%}.notice{padding:12px;background:#f0eee8;border-left:3px solid var(--copper);margin:14px 0;overflow-wrap:anywhere}a{color:var(--navy)}@media(max-width:520px){.panel{margin:25px 14px}}
</style></head><body><header class="top">EVERHAVEN<small>SECURE ACCOUNT RECOVERY</small></header><main class="panel"><h1>Create a new password</h1><p class="muted">Choose a new password for your private Everhaven owner account.</p><form id="resetForm"><label>New password<input id="password" class="field" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirm new password<input id="confirm" class="field" type="password" minlength="8" autocomplete="new-password" required></label><button id="save" type="submit">Save new password</button></form><p id="message" class="notice" aria-live="polite">Open this page using the password reset link sent to your email.</p><p><a href="/admin.html">Return to owner sign in</a></p></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://rpzmjiiomgjttjjrkkqf.supabase.co','sb_publishable_Lwcv2EAfLV4gAn51_JtlVA_iEEimZIi');
const form=document.getElementById('resetForm'),message=document.getElementById('message'),save=document.getElementById('save');
let recoveryReady=false;
const {data:{session},error}=await supabase.auth.getSession();
if(session){recoveryReady=true;message.textContent='Recovery session detected. Enter your new password.'}
else if(error){message.textContent='Could not validate the recovery link: '+error.message}
else{message.textContent='No active recovery session was found. Open the newest reset email link again, or request another link from the owner sign-in page.'}
supabase.auth.onAuthStateChange((event,newSession)=>{if(event==='PASSWORD_RECOVERY'&&newSession){recoveryReady=true;message.textContent='Recovery link verified. Enter your new password.'}});
form.addEventListener('submit',async e=>{
 e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirm').value;
 if(!recoveryReady){message.textContent='Your recovery link is not active. Request a new one from owner sign in.';return}
 if(p.length<8){message.textContent='Use at least 8 characters.';return}
 if(p!==c){message.textContent='The passwords do not match.';return}
 save.disabled=true;message.textContent='Updating password…';
 const {error}=await supabase.auth.updateUser({password:p});
 save.disabled=false;
 if(error){message.textContent='Password update failed: '+error.message;return}
 message.textContent='Password updated successfully. You can now sign in to the owner dashboard.';
 form.reset();await supabase.auth.signOut();
});
</script></body></html>
